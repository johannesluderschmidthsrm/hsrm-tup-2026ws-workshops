<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map: Beispiel OpenStreetmap-Einbindung</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <!-- Eigene Styles -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
        }

        main h1 {
            text-align: center;
            padding: 0;
        }

        #map {
            display: block;
            min-width: min(100%, 400px);
            width: 80vmin;
            max-height: 100vh;
            aspect-ratio: 1 / 1;
            background-color: #EEE;
            margin: 1em auto;
            border-radius: .5em;
            box-shadow: .3em .3em 1.5em rgba(0, 0, 0, .2);
        }
    </style>
</head>

<body>
    <main>
        <h1>Beispiel OpenStreetmap-Einbindung</h1>
        <div id="map"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.8.0/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([50.0968, 8.2168], 16);

        L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
            attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
            maxZoom: 18,
        }).addTo(map);
    </script>
</body>

</html>
