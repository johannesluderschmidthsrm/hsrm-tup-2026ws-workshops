<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIkit Grundlage</title>

    <!-- UIkit CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.21.1/dist/css/uikit.min.css" />

    <!-- UIkit JS -->
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.1/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.1/dist/js/uikit-icons.min.js"></script>

    <!-- Custom CSS -->
    <style>
        /* Basics */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --c-primary: #a71e5e;
            --c-secondary: #e30613;
            --c-tertiary: #979290;

            --c-primary-d: #5a0f32;
            --c-secondary-d: #96000f;
            --c-tertiary-d: #46413c;

            --c-tertiary-h: #ebe6e5;
        }

        body {
            font-family: Roboto, sans-serif;
            margin: 2em;
            padding: 0;
            line-height: 1.5;
        }

        section {
            margin: 2em 0;
        }

        .uk-grid {

            &>:first-child {
                counter-reset: grid-counter;
            }

            &>* {}

            &>::before {
                counter-increment: grid-counter;
                content: 'Spalte ' counter(grid-counter);
                background-color: var(--c-tertiary-h);
                color: white;
                border: white solid 1px;
                padding: 1em;
                display: block;
                min-height: 8em;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: .6em;
            }
        }
    </style>
</head>

<body>
    <main>

        <section class="uk-container">
            <h2>UIkit Grid (vom Elternelement gesteuert)</h2>

            <div class="uk-grid uk-grid-collapse uk-text-center
            uk-child-width-1-2@s 
            uk-child-width-1-3@m 
            uk-child-width-1-4@l">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>

        </section>

        <section class="uk-container">
            <h2>UIkit Grid (von den Kindelementen gesteuert)</h2>


            <div class="uk-grid uk-grid-collapse uk-text-center">
                <div class="uk-width-1-2@l"></div>
                <div class="uk-width-1-3@l"></div>
                <div class="uk-width-1-6@l"></div>
                <div class="uk-width-1-4@l"></div>
                <div class="uk-width-3-4@l"></div>
                <div class="uk-width-1-3@l"></div>
                <div class="uk-width-2-3@l"></div>
            </div>

        </section>

        <footer class="uk-container">
            Weiter Informationen zum UIkit Grid finden Sie <a href="https://getuikit.com/docs/introduction">hier</a>.
        </footer>
    </main>
</body>

</html>
