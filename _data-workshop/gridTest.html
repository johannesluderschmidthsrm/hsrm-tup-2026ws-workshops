<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{
            background-color: blueviolet;
            padding: 1rem;

            display: grid;
            gap: 1rem;

            grid-template-columns: 1fr 3fr 1fr;
            grid-template-rows: 1fr 3fr 1fr;

            height: 50vh;

        }
        main>div{
            background-color: orange;
            min-width: 5rem;
            min-height: 2rem;
        }

        .wide{
            grid-column: span 3;
        }

    </style>
</head>
<body>

    <main>

        <div></div>
        <div></div>
        <div class="wide"></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>

    </main>
    
</body>
</html>
